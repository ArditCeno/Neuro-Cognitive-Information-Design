name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web (JS syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check JS
        run: |
          fail=0
          for f in js/*.js; do node --check "$f" || fail=1; done
          exit $fail
      - name: Self-tests (structure, materials, diagrams, config)
        run: node scripts/test-all.mjs
      - name: Link and HTML quality checks
        run: node scripts/test-links.mjs
      - name: AOI engine unit checks
        run: node scripts/test-aoi.mjs
      - name: Worker unit checks (validation, caps, email parsing)
        run: node scripts/test-worker.mjs
      - name: SEO, metadata and PWA checks
        run: node scripts/test-seo.mjs
      - name: End-to-end report test (named participant)
        run: node scripts/test-report.mjs
      - name: Live endpoint check (admin/submission API)
        continue-on-error: true
        run: node scripts/test-endpoint.mjs
      - name: Generate materials (smoke)
        run: node scripts/gen-materials.mjs

  python:
    name: Python (analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt
      - name: Compile analysis
        run: python -m compileall analysis
      - name: Import check
        run: |
          python - <<'PY'
          import pandas, numpy, scipy, statsmodels, matplotlib
          print("deps ok")
          PY
      - name: Unit tests (analysis)
        run: python -m unittest discover -s analysis -p "test_*.py"
