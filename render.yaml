# NCID Backend — Render blueprint (optional).
# Set the secret env vars in the Render dashboard; do not commit them.
services:
  - type: web
    name: ncid-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: NCID_ADMIN_TOKEN
        sync: false
      - key: NCID_ALLOWED_ORIGINS
        value: https://arditceno.github.io
