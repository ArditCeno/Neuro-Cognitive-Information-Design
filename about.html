    <p class="lead" data-en="A short, precise summary of the problem, the method and why it matters."
       data-al="Një përmbledhje e shkurtër dhe e saktë e problemit, metodës dhe pse ka rëndësi."></p>

      <article class="card tint-red">
        <h3 data-en="The real-world problem" data-al="Problemi i botës reale">The real-world problem</h3>
        <p data-en="Contracts, medical charts and financial reports are still written for the page, not for the reader. Dense layouts create avoidable cognitive load, and their evaluation stays subjective — “I like this layout”."
           data-al="Kontratat, kartelat mjekësore dhe raportet financiare shkruhen ende për faqen, jo për lexuesin. Formatet e ngjeshura krijojnë ngarkesë kognitive të shmangshme dhe vlerësimi i tyre mbetet subjektiv — “më pëlqen kjo pamje”."></p>
      </article>
      <article class="card tint-green">
        <h3 data-en="The scientific solution" data-al="Zgjidhja shkencore">The scientific solution</h3>
        <p data-en="With only a webcam we measure eye fixations, reading time and comprehension accuracy to prove which formats reduce cognitive load — turning preference into data."
           data-al="Vetëm me një webcam matim fiksimet e syrit, kohën e leximit dhe saktësinë e kuptimit për të provuar cilat formate reduktojnë ngarkesën kognitive — duke e kthyer preferencën në të dhëna."></p>
      </article>
    </div>
  </section>

    </div>

      <article class="card"><h3 data-en="Social" data-al="Shoqërore">Social</h3><p data-en="Fewer errors in critical documents (legal, financial, medical)." data-al="Më pak gabime në dokumente kritike (ligjore, financiare, mjekësore)."></p></article>
      <article class="card"><h3 data-en="Academic" data-al="Akademike">Academic</h3><p data-en="Contributes to neuro-cognitive readability and information design." data-al="Kontribut në neuroshkencën e lexueshmërisë dhe dizajnit të informacionit."></p></article>
      <article class="card"><h3 data-en="Technological" data-al="Teknologjike">Technological</h3><p data-en="Cognitive load measured through free, open-source tools." data-al="Ngarkesa kognitive matet me mjete open-source dhe pa kosto."></p></article>
      <article class="card"><h3 data-en="Economic" data-al="Ekonomike">Economic</h3><p data-en="Productivity gains and lower cost of mistakes." data-al="Përmirësim i produktivitetit dhe ulje e kostove të gabimeve."></p></article>
