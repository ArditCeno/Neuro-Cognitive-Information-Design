<h1>Biotechnology - Senior - M2 - CRISPR-Cas9</h1>
<figure class="diagram"><img src="assets/diagrams/biotech_senior_m2.svg" width="640" height="266" alt="CRISPR-Cas9" loading="lazy" decoding="async"></figure>

<ul>
<li>Cas9 cuts DNA guided by a guide RNA (gRNA)</li>
<li>A PAM (e.g. NGG for SpCas9) is needed near the target</li>
<li>The double-strand break (DSB) is repaired by NHEJ or HDR</li>
<li>NHEJ often causes indels (gene knockout)</li>
<li data-aoi="kritike" data-critical="true">Risk: off-target cuts</li>
</ul>
