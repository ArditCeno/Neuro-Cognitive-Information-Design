<li>Cas9 cuts DNA guided by a guide RNA (gRNA)</li>
<li>A PAM (e.g. NGG for SpCas9) is needed near the target</li>
<li>The double-strand break (DSB) is repaired by NHEJ or HDR</li>
<li>NHEJ often causes indels (gene knockout)</li>
