<h1>Culinary - Senior - M2 - Food cost and pricing</h1>
<figure class="diagram"><img src="assets/diagrams/cook_senior_m2.svg" width="640" height="268" alt="Food cost and pricing" loading="lazy" decoding="async"></figure>

<p>Food cost % = food cost / selling price x 100 Typical target: about 28-35% Price = cost / target % Example: cost 3 EUR, target 30% -&gt; price 10 EUR <span data-aoi="kritike" data-critical="true">Gross margin = price - cost</span></p>
