<p>A deadline is a period for an action For days: the start day is not counted A monthly deadline ends on the corresponding date If the last day is a holiday it moves to the first working day (teaching rule) <span data-aoi="kritike" data-critical="true">Missing it can cause loss of the right</span></p>
