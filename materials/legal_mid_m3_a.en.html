<ul>
<li>Necessary condition: without it, no effect</li>
<li>Sufficient condition: it alone suffices</li>
<li>Cumulative: all needed (AND)</li>
<li>Alternative: one suffices (OR)</li>
<li data-aoi="kritike" data-critical="true">Order: check conditions, then the consequence</li>
</ul>
