<h1>Culinary - fillestar - M2 - Hygiene and temperature</h1>
<img class="fig" src="../assets/figures/cook.svg" alt="cook figure">
<ul>
<li>Wash hands 20-30 s before cooking</li>
<li>Danger zone: 5-60 C</li>
<li>Poultry: 74 C inside</li>
<li>Keep cold at or below 5 C</li>
<li data-aoi="kritike" data-critical="true">Do not use the same board for raw meat and salad</li>
