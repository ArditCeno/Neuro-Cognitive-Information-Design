<h1>Law - fillestar - M3 - Deadlines</h1>
<figure class="diagram"><img src="assets/diagrams/legal_fillestar_m3.svg" width="640" height="250" alt="Deadlines (teaching rule)" loading="lazy" decoding="async"></figure>

<ul>
<li>A deadline is a period for an action</li>
<li>For days: the start day is not counted</li>
<li>A monthly deadline ends on the corresponding date</li>
<li>If the last day is a holiday it moves to the first working day (teaching rule)</li>
<li data-aoi="kritike" data-critical="true">Missing it can cause loss of the right</li>
</ul>
