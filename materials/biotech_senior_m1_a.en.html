<h1>Biotechnology - Senior - M1 - Gene cloning</h1>
<figure class="diagram"><img src="assets/diagrams/biotech_senior_m1.svg" width="640" height="270" alt="Gene cloning" loading="lazy" decoding="async"></figure>

<ul>
<li>1) Isolate the gene/DNA</li>
<li>2) Cut with restriction enzymes</li>
<li>3) Ligate into a vector</li>
<li>4) Transform into bacteria (e.g. E. coli)</li>
<li data-aoi="kritike" data-critical="true">5) Select (antibiotic) and verify (sequencing)</li>
</ul>
