<h1>Finance - senior - M2 - Valuation (NPV)</h1>
<figure class="diagram"><img src="assets/diagrams/finance_senior_m2.svg" width="640" height="292" alt="Valuation (NPV)" loading="lazy" decoding="async"></figure>

<ul>
<li>Present value = cash flows / (1+r)^t</li>
<li>NPV = sum of present values - investment</li>
<li>NPV &gt; 0: the project creates value</li>
<li>The discount rate r reflects risk</li>
<li data-aoi="kritike" data-critical="true">Example: invest 1000, flow 1100 after 1 year, r=10% -&gt; NPV = 0</li>
</ul>
