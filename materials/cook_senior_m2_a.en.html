<ul>
<li>Food cost % = food cost / selling price x 100</li>
<li>Typical target: about 28-35%</li>
<li>Price = cost / target %</li>
<li>Example: cost 3 EUR, target 30% -&gt; price 10 EUR</li>
<li data-aoi="kritike" data-critical="true">Gross margin = price - cost</li>
</ul>
