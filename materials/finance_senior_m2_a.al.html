<h1>Financë - Senior - M2 — Vlerësim (NPV)</h1>
<ul>
<li>Vlera aktuale = flukset / (1+r)^t</li>
<li>NPV = shuma e vlerave aktuale − investimi</li>
<li>NPV &gt; 0: projekti krijon vlerë</li>
<li>Norma e skontimit r pasqyron rrezikun</li>
<li data-aoi="kritike" data-critical="true">Shembull: investim 1000, fluks 1100 pas 1 viti, r=10% → NPV = 0</li>
</ul>
