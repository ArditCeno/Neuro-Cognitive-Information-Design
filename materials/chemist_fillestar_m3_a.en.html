<h1>Chemistry - Beginner - M3 - pH scale</h1>
<figure class="diagram"><img src="assets/diagrams/chemist_fillestar_m3.svg" width="640" height="200" alt="pH scale" loading="lazy" decoding="async"></figure>

<ul>
<li>pH = -log[H+]</li>
<li>pH &lt; 7 acid, = 7 neutral, &gt; 7 basic</li>
<li>0.01 M HCl -&gt; pH = 2</li>
<li>Molarity M = n/V</li>
<li data-aoi="kritike" data-critical="true">Each pH unit = 10x change in [H+]</li>
</ul>
