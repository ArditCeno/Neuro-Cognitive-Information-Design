<h1>Biology - mid - M1 - Photosynthesis and respiration</h1>

<p>Photosynthesis: 6CO2 + 6H2O + light -&gt; C6H12O6 + 6O2 Cellular respiration: C6H12O6 + 6O2 -&gt; 6CO2 + 6H2O + ATP Photosynthesis stores energy; respiration releases it Glycolysis occurs in the cytoplasm <span data-aoi="kritike" data-critical="true">Krebs cycle in the mitochondrial matrix</span></p>
