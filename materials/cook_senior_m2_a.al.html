<h1>Kuzhinieri - Senior - M2 — Kosto ushqimore dhe çmimi</h1>
<ul>
<li>Food cost % = kosto ushqimi / çmimi i shitjes × 100</li>
<li>Objektiv tipik: ~28–35%</li>
<li>Çmimi = kosto / target %</li>
<li>Shembull: kosto 3 €, target 30% → çmimi 10 €</li>
<li data-aoi="kritike" data-critical="true">Marzhi bruto = çmim − kosto</li>
</ul>
