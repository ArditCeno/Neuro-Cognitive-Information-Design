<h1>Biologji - Mid - M1 — Proceset: fotosinteza dhe frymëmarrja</h1>
<p>Fotosinteza: 6CO₂ + 6H₂O + dritë → C₆H₁₂O₆ + 6O₂ Frymëmarrja qelizore: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ATP Fotosinteza ruan energji; frymëmarrja e çliron Glikoliza ndodh në citoplazmë <span data-aoi="kritike" data-critical="true">Cikli i Krebsit në matricën mitokondriale</span></p>
