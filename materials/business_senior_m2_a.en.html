<h1>Business - senior - M2 - ROI and investments</h1>
<img class="fig" src="../assets/figures/business.svg" alt="business figure">
<ul>
<li>ROI = (profit - investment cost) / investment cost</li>
<li>Payback = investment / annual flow</li>
<li>Example: invest 50,000, flow 20,000/yr -&gt; 2.5 years</li>
<li>NPV accounts for the time value of money</li>
<li data-aoi="kritike" data-critical="true">ROI ignores time</li>
</ul>
