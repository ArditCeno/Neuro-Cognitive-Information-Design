<h1>Culinary - mid - M3 - Scaling recipes and yield</h1>
<figure class="diagram"><img src="assets/diagrams/cook_mid_m3.svg" width="640" height="252" alt="Scaling recipes and yield" loading="lazy" decoding="async"></figure>

<ul>
<li>Factor = desired portions / original portions</li>
<li>Edible yield % = edible / purchased x 100</li>
<li>Example: 1 kg purchased, 800 g edible -&gt; 80%</li>
<li>Cost per portion = total cost / portions</li>
<li data-aoi="kritike" data-critical="true">Round carefully (spices are not linear)</li>
</ul>
