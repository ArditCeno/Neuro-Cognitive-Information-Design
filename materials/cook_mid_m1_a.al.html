<h1>Kuzhinieri - Mid - M1 — Koordinimi i proceseve: pasta me salcë</h1>
<figure class="diagram"><img src="assets/diagrams/cook_mid_m1.svg" width="640" height="286" alt="Coordinating: pasta with sauce" loading="lazy" decoding="async"></figure>

<ul>
<li>Ujë 1 L për 100 g makarona; kripë ~10 g/L</li>
<li>Makaronat al dente: ~8–10 min</li>
<li>Salca gatuhet paralelisht (15 min)</li>
<li>Fillo ujin e vluar së pari (proces i gjatë)</li>
<li data-aoi="kritike" data-critical="true">Bashko në fund (1–2 min në tigan)</li>
</ul>
