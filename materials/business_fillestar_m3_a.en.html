<h1>Business - fillestar - M3 - Cost and simple break-even</h1>
<img class="fig" src="../assets/figures/business.svg" alt="business figure">
<ul>
<li>Break-even (units) = fixed cost / (price - variable cost)</li>
<li>Example: fixed 2,000, price 10, variable 6 -&gt; 500 units</li>
<li>Above break-even: profit</li>
<li>Below break-even: loss</li>
<li data-aoi="kritike" data-critical="true">Raising the price lowers the break-even</li>
</ul>
