<h1>Business - Beginner - M3 - Break-even</h1>
<figure class="diagram"><img src="assets/diagrams/business_fillestar_m3.svg" width="640" height="310" alt="Break-even" loading="lazy" decoding="async"></figure>

<p>Break-even (units) = fixed cost / (price - variable cost) Example: fixed 2,000, price 10, variable 6 -&gt; 500 units Above break-even: profit Below break-even: loss <span data-aoi="kritike" data-critical="true">Raising the price lowers the break-even</span></p>
