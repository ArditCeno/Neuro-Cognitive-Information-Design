<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Systems and terminology">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="283" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Systems and terminology</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="56" width="288" height="208" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="40" y="82" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">Suffixes / prefixes</text><text x="40" y="116" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">-itis</text><text x="150" y="116" font-size="12" font-weight="400" fill="#092634" text-anchor="start">inflammation</text><text x="40" y="148" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">-ectomy</text><text x="150" y="148" font-size="12" font-weight="400" fill="#092634" text-anchor="start">surgical removal</text><text x="40" y="180" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">tachy-</text><text x="150" y="180" font-size="12" font-weight="400" fill="#092634" text-anchor="start">fast</text><text x="40" y="212" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">brady-</text><text x="150" y="212" font-size="12" font-weight="400" fill="#092634" text-anchor="start">slow</text><rect x="328" y="56" width="288" height="208" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="344" y="82" font-size="13" font-weight="700" fill="#7a2b12" text-anchor="start">Terms</text><text x="344" y="116" font-size="12" font-weight="700" fill="#092634" text-anchor="start">Tachycardia</text><text x="452" y="116" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">&gt; 100 /min</text><text x="344" y="148" font-size="12" font-weight="700" fill="#092634" text-anchor="start">Bradycardia</text><text x="452" y="148" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">&lt; 60 /min</text><text x="344" y="180" font-size="12" font-weight="700" fill="#092634" text-anchor="start">Hypertension</text><text x="452" y="180" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">&gt;= 140 / 90</text><text x="344" y="212" font-size="12" font-weight="700" fill="#092634" text-anchor="start">Dyspnea</text><text x="452" y="212" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">difficulty breathing</text>
</svg>
