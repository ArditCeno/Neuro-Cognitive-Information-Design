<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" width="640" height="286" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Population and ecosystem ecology">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="285" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Population and ecosystem ecology</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<polygon points="320,60 220,140 420,140" fill="#FEF7C3" stroke="#d5dbdf"/><text x="320" y="112" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">producers</text><polygon points="250,144 390,144 370,196 270,196" fill="#DFF0D8" stroke="#d5dbdf"/><text x="320" y="176" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">herbivores  ~10%</text><polygon points="286,200 354,200 344,240 296,240" fill="#FDE7DF" stroke="#d5dbdf"/><text x="320" y="226" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">carnivores</text><text x="440" y="90" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">10% rule</text><text x="440" y="116" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">~10% of energy</text><text x="440" y="134" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">passes up a level</text><text x="24" y="268" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">Logistic growth is limited by carrying capacity (K).  Hardy-Weinberg: p^2 + 2pq + q^2 = 1.</text>
</svg>
