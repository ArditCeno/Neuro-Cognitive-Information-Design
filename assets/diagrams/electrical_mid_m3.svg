<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="RC filters">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="249" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">RC filters</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="80" y="70" width="200" height="130" fill="none" stroke="#0E7FB0" stroke-width="2.5"/><rect x="150" y="60" width="60" height="20" fill="#092634"/><text x="180" y="52" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">Vin</text><rect x="106" y="108" width="60" height="26" fill="#fff" stroke="#092634"/><text x="136" y="126" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">R</text><line x1="166" y1="121" x2="250" y2="121" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><text x="196" y="110" font-size="10" font-weight="400" fill="#004E72" text-anchor="start">Vout</text><line x1="126" y1="190" x2="146" y2="190" stroke="#092634" stroke-width="2"/><line x1="130" y1="198" x2="142" y2="198" stroke="#092634" stroke-width="2"/><text x="156" y="194" font-size="10" font-weight="400" fill="#2F7FA0" text-anchor="start">C</text><text x="340" y="100" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">f_c = 1 / (2 pi R C)</text><text x="340" y="132" font-size="12" font-weight="400" fill="#092634" text-anchor="start">R = 1k, C = 1uF  -&gt;  f_c ~ 159 Hz</text><text x="340" y="162" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">Low-pass passes low frequencies</text><text x="340" y="186" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">High-pass passes high ones</text><text x="340" y="212" font-size="12" font-weight="400" fill="#092634" text-anchor="start">At f_c amplitude = 70.7%  (-3 dB)</text>
</svg>
