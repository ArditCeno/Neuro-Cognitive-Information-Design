<line x1="60" y1="180" x2="600" y2="180" stroke="#d5dbdf" stroke-width="1.3"/><path d="M80 110 L160 110 L160 180 L240 180" fill="none" stroke="#FF6E42" stroke-width="2.5"/><text x="170" y="96" font-size="11.5" font-weight="400" fill="#FF6E42" text-anchor="start">exothermic  dH &lt; 0</text><path d="M360 180 L440 180 L440 110 L520 110" fill="none" stroke="#0E7FB0" stroke-width="2.5"/><text x="440" y="96" font-size="11.5" font-weight="400" fill="#0E7FB0" text-anchor="middle">endothermic  dH &gt; 0</text><g transform="translate(0,200)"><rect x="24" y="52" width="592" height="30" rx="8" fill="#ffffff" stroke="#d5dbdf"/><text x="40" y="72" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">q = m x c x dT      c(water) = 4.18 J/g/C</text><rect x="24" y="90" width="592" height="30" rx="8" fill="#F5F8FA" stroke="#d5dbdf"/><text x="40" y="110" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">dH = sum of dH of steps (Hess)</text><rect x="24" y="128" width="592" height="30" rx="8" fill="#ffffff" stroke="#d5dbdf"/><text x="40" y="148" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">dG = dH - T dS  ;  dG &lt; 0 spontaneous</text></g>
</svg>
