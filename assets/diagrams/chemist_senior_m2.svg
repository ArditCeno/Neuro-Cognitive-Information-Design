<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" width="640" height="376" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Thermochemistry">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="375" fill="#ffffff" stroke="#d5dbdf"/>
