<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" width="640" height="282" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Complex case (qSOFA)">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="281" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Complex case (qSOFA)</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<text x="24" y="76" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">Sepsis-3  qSOFA predictors</text><rect x="24" y="96" width="380" height="34" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="40" y="118" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">RR &gt;= 22</text><text x="230" y="118" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">respiration</text><rect x="24" y="138" width="380" height="34" rx="8" fill="#F5F8FA" stroke="#d5dbdf"/><text x="40" y="160" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Altered mental status</text><text x="230" y="160" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">consciousness</text><rect x="24" y="180" width="380" height="34" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="40" y="202" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Systolic BP &lt;= 100</text><text x="230" y="202" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">blood pressure</text><rect x="430" y="96" width="186" height="118" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="523" y="132" font-size="13" font-weight="700" fill="#7a2b12" text-anchor="middle">&gt;= 2 criteria</text><text x="523" y="158" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="middle">high risk</text><text x="523" y="180" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="middle">urgent assessment</text><text x="24" y="240" font-size="12" font-weight="400" fill="#092634" text-anchor="start">A patient with comorbidities: prioritise the life-threatening problem.</text><text x="24" y="264" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">Work with a multidisciplinary team.</text>
</svg>
