<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Multi-factor analysis">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="241" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Multi-factor analysis</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="52" width="592" height="30" rx="8" fill="#ffffff" stroke="#d5dbdf"/><text x="40" y="72" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Contribution margin = price - variable cost</text><rect x="24" y="90" width="592" height="30" rx="8" fill="#F5F8FA" stroke="#d5dbdf"/><text x="40" y="110" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Break-even = fixed cost / contribution margin</text><rect x="24" y="128" width="592" height="30" rx="8" fill="#ffffff" stroke="#d5dbdf"/><text x="40" y="148" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Example: 10000 / (50 - 30) = 500 units</text><text x="24" y="202" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Sensitivity: change one variable at a time.</text><text x="24" y="226" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Multi-variable: change several together.</text>
</svg>
