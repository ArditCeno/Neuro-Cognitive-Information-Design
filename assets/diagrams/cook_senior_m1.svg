<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Optimisation and time management">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="283" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Optimisation and time management</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="60" width="288" height="208" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="40" y="86" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">Batch cooking (series)</text><text x="40" y="118" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Cook in series to save time</text><text x="40" y="146" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• FIFO: first in, first out</text><text x="40" y="174" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Station order: cleaning,</text><text x="40" y="202" font-size="12" font-weight="400" fill="#092634" text-anchor="start">•    production, service</text><text x="40" y="230" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Measure: time per portion</text><rect x="328" y="60" width="288" height="208" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="344" y="86" font-size="13" font-weight="700" fill="#7a2b12" text-anchor="start">Minimise switching</text><text x="344" y="118" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Group similar tasks</text><text x="344" y="146" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Avoid time lost switching</text><text x="344" y="174" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Pre-prep once</text><text x="344" y="202" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Keep the flow linear</text>
</svg>
