<rect x="70" y="70" width="240" height="170" rx="14" fill="#EFF7F0" stroke="#4f8f5a" stroke-width="2"/><text x="190" y="232" font-size="10.5" font-weight="400" fill="#3f7a4a" text-anchor="middle">cell wall (plants)</text><circle cx="190" cy="150" r="180" fill="none" stroke="none"/><circle cx="150" cy="140" r="34" fill="#E8F1F7" stroke="#0E7FB0"/><text x="150" y="144" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">nucleus</text><ellipse cx="250" cy="110" rx="26" ry="12" fill="#FDE7DF" stroke="#FF6E42"/><text x="250" y="114" font-size="9" font-weight="400" fill="#7a2b12" text-anchor="middle">mito.</text><ellipse cx="250" cy="175" rx="26" ry="12" fill="#FDE7DF" stroke="#FF6E42"/><text x="250" y="179" font-size="9" font-weight="400" fill="#7a2b12" text-anchor="middle">mito.</text><ellipse cx="110" cy="200" rx="26" ry="12" fill="#FDE7DF" stroke="#FF6E42"/><text x="110" y="204" font-size="9" font-weight="400" fill="#7a2b12" text-anchor="middle">mito.</text><circle cx="185" cy="195" r="6" fill="#2F7FA0"/><text x="185" y="214" font-size="9" font-weight="400" fill="#2F7FA0" text-anchor="middle">ribosome</text><ellipse cx="215" cy="112" rx="20" ry="12" fill="#DFF0D8" stroke="#3f7a4a"/><text x="215" y="116" font-size="9" font-weight="400" fill="#3f7a4a" text-anchor="middle">chloro.</text><text x="340" y="100" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Nucleus: genetic material</text><text x="340" y="128" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Mitochondria: ATP production</text><text x="340" y="156" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Ribosomes: protein synthesis</text><text x="340" y="184" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Chloroplast: photosynthesis</text><text x="340" y="212" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Cell wall: plants, not animals</text>
