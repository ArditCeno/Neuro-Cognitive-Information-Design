<rect x="24" y="66" width="592" height="40" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="40" y="91" font-size="12.5" font-weight="700" fill="#092634" text-anchor="start">Warfarin + NSAID</text><text x="340" y="91" font-size="12" font-weight="400" fill="#7a2b12" text-anchor="start">increased bleeding risk</text><rect x="24" y="116" width="592" height="40" rx="8" fill="#F5F8FA" stroke="#d5dbdf"/><text x="40" y="141" font-size="12.5" font-weight="700" fill="#092634" text-anchor="start">ACE inhibitor + K-sparing diuretic</text><text x="340" y="141" font-size="12" font-weight="400" fill="#7a2b12" text-anchor="start">hyperkalaemia risk</text><rect x="24" y="166" width="592" height="40" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="40" y="191" font-size="12.5" font-weight="700" fill="#092634" text-anchor="start">Metformin + eGFR &lt; 30</text><text x="340" y="191" font-size="12" font-weight="400" fill="#7a2b12" text-anchor="start">contraindicated</text><text x="24" y="250" font-size="12" font-weight="400" fill="#004E72" text-anchor="start">Polypharmacy increases interactions.  Verify every combination.</text>
