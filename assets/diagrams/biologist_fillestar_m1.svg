<rect x="215" y="360" width="210" height="38" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="320" y="384" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Species</text><rect x="190" y="316" width="260" height="38" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="320" y="340" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Genus</text><rect x="165" y="272" width="310" height="38" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="320" y="296" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Family</text><rect x="140" y="228" width="360" height="38" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="320" y="252" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Order</text><rect x="115" y="184" width="410" height="38" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="320" y="208" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Class</text><rect x="90" y="140" width="460" height="38" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="320" y="164" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Phylum</text><rect x="65" y="96" width="510" height="38" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="320" y="120" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Kingdom</text><rect x="40" y="52" width="560" height="38" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="320" y="76" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Domain</text><text x="24" y="60" font-size="12.5" font-weight="700" fill="#004E72" text-anchor="start">Ranks (bottom to top)</text><text x="24" y="434" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">3 domains: Bacteria, Archaea, Eukarya.  Binomial name = genus + species (Homo sapiens).</text>
