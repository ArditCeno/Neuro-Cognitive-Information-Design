<rect x="215" y="228" width="210" height="38" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="320" y="252" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Physiological needs</text><rect x="171.25" y="184" width="297.5" height="38" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="320" y="208" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Safety</text><rect x="127.5" y="140" width="385" height="38" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="320" y="164" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Social / belonging</text><rect x="83.75" y="96" width="472.5" height="38" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="320" y="120" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Esteem</text><rect x="40" y="52" width="560" height="38" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="320" y="76" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Self-actualisation</text><text x="24" y="66" font-size="12.5" font-weight="700" fill="#004E72" text-anchor="start">ABC: airway - breathing - circulation</text><text x="24" y="304" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">Prioritise life threats first. Delegate the right task to the right staff. Reassess continuously.</text>
