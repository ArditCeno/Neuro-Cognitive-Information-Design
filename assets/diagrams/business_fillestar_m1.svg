<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" width="640" height="252" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Basic indicators">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="251" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Basic indicators</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="52" width="592" height="30" rx="8" fill="#ffffff" stroke="#d5dbdf"/><text x="40" y="72" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Revenue = price x quantity</text><rect x="24" y="90" width="592" height="30" rx="8" fill="#F5F8FA" stroke="#d5dbdf"/><text x="40" y="110" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Cost = fixed + variable</text><rect x="24" y="128" width="592" height="30" rx="8" fill="#ffffff" stroke="#d5dbdf"/><text x="40" y="148" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Profit = revenue - cost</text><rect x="24" y="166" width="592" height="30" rx="8" fill="#F5F8FA" stroke="#d5dbdf"/><text x="40" y="186" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Market share = firm sales / market sales</text><rect x="24" y="204" width="592" height="30" rx="8" fill="#ffffff" stroke="#d5dbdf"/><text x="40" y="224" font-size="13.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Example: 20 x 500 = 10,000 revenue</text>
</svg>
