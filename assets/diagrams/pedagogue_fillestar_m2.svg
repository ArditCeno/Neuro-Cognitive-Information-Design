<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" width="640" height="212" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Objectives">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="211" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Objectives</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="52" width="288" height="146" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="38" y="74" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">Use measurable verbs</text><text x="38" y="98" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• list</text><text x="38" y="124" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• compare</text><text x="38" y="150" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• solve</text><text x="38" y="176" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• one objective = one outcome</text><text x="38" y="202" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• linked to assessment</text><rect x="328" y="52" width="288" height="146" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="342" y="74" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">Avoid vague verbs</text><text x="342" y="98" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• understand</text><text x="342" y="124" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• know</text><text x="342" y="150" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• appreciate</text><text x="342" y="176" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• be aware of</text><text x="342" y="202" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• learn about</text>
</svg>
