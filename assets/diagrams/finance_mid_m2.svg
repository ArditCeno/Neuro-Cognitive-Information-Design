<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" width="640" height="282" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="KPIs">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="281" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">KPIs</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="56" width="284" height="84" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="40" y="88" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">Gross margin</text><text x="40" y="114" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">gross profit / revenue</text><rect x="324" y="56" width="284" height="84" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="340" y="88" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">ROI</text><text x="340" y="114" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">(gain - investment) / investment</text><rect x="24" y="152" width="284" height="84" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="40" y="184" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">YoY growth</text><text x="40" y="210" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">year over year</text><rect x="324" y="152" width="284" height="84" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="340" y="184" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">Current ratio</text><text x="340" y="210" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">assets / liabilities</text><text x="24" y="268" font-size="12" font-weight="400" fill="#092634" text-anchor="start">A KPI without a target is useless.</text>
</svg>
