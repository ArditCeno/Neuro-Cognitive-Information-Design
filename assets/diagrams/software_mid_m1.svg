<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Functions">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="241" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Functions</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="52" width="592" height="180" rx="8" fill="#F7FAFB" stroke="#d5dbdf"/><text x="40" y="74" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">def f(x, y=2):</text><text x="300" y="74" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">y has a default</text><text x="40" y="104" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">    return x * y</text><text x="300" y="104" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">returns the result</text><text x="40" y="134" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">f(3)</text><text x="300" y="134" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">-&gt; 6</text><text x="40" y="164" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">f(3, 4)</text><text x="300" y="164" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">-&gt; 12</text><text x="40" y="194" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">no return</text><text x="300" y="194" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">-&gt; None</text><text x="40" y="224" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">local variable</text><text x="300" y="224" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">exists only inside</text>
</svg>
