<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 186" width="640" height="186" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Assessment">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="185" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Assessment</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="52" width="288" height="120" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="38" y="74" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">Formative</text><text x="38" y="98" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• during learning</text><text x="38" y="124" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• to improve</text><text x="38" y="150" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• specific, timely feedback</text><text x="38" y="176" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• self-assessment</text><rect x="328" y="52" width="288" height="120" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="342" y="74" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start">Summative</text><text x="342" y="98" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• at the end</text><text x="342" y="124" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• for a grade</text><text x="342" y="150" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• criteria and rubrics</text><text x="342" y="176" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">• measures achievement</text>
</svg>
