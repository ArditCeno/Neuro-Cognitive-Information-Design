<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Budget (50 / 30 / 20)">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="279" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Budget (50 / 30 / 20)</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="40" y="80" width="280" height="60" fill="#0E7FB0"/><text x="180" y="116" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Needs</text><text x="180" y="160" font-size="12" font-weight="700" fill="#0E7FB0" text-anchor="middle">50%</text><rect x="320" y="80" width="168" height="60" fill="#2F7FA0"/><text x="404" y="116" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Wants</text><text x="404" y="160" font-size="12" font-weight="700" fill="#2F7FA0" text-anchor="middle">30%</text><rect x="488" y="80" width="112" height="60" fill="#FF6E42"/><text x="544" y="116" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Savings</text><text x="544" y="160" font-size="12" font-weight="700" fill="#FF6E42" text-anchor="middle">20%</text><text x="40" y="210" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">Balance = income - expenses</text><text x="40" y="236" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">Emergency fund: 3-6 months of expenses</text><text x="40" y="262" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">Compare plan with actuals monthly</text>
