<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Conflict of norms">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="259" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Conflict of norms</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="56" width="288" height="156" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="40" y="82" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">Hierarchy</text><rect x="48" y="96" width="240" height="28" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="168" y="115" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Constitution</text><rect x="68" y="130" width="200" height="28" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="168" y="149" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Law</text><rect x="88" y="164" width="160" height="28" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="168" y="183" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Sub-legal act</text><text x="328" y="90" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">Lex superior</text><text x="328" y="110" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">the higher norm prevails</text><text x="328" y="136" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">Lex specialis</text><text x="328" y="156" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">the special beats the general</text><text x="328" y="182" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">Lex posterior</text><text x="328" y="202" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">the later beats the earlier</text><text x="328" y="244" font-size="11.5" font-weight="400" fill="#092634" text-anchor="start">Apply: superior, then specialis, then posterior</text>
</svg>
