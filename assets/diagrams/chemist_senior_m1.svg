<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" width="640" height="272" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Reaction networks and yield">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="271" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Reaction networks and yield</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="40" y="76" width="140" height="56" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="110" y="110" font-size="15" font-weight="400" fill="#092634" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">A</text><rect x="240" y="76" width="140" height="56" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="310" y="110" font-size="15" font-weight="400" fill="#092634" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">B</text><rect x="440" y="76" width="140" height="56" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="510" y="110" font-size="15" font-weight="400" fill="#092634" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">C</text><line x1="180" y1="104" x2="240" y2="104" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><text x="210" y="94" font-size="11" font-weight="400" fill="#004E72" text-anchor="middle">80%</text><line x1="380" y1="104" x2="440" y2="104" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><text x="410" y="94" font-size="11" font-weight="400" fill="#004E72" text-anchor="middle">90%</text><text x="24" y="190" font-size="13.5" font-weight="700" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Overall yield = 0.80 x 0.90 = 72%</text><text x="24" y="226" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Equilibrium  Kc = [products] / [reactants]  (coefficients as powers)</text><text x="24" y="252" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">Le Chatelier: the system opposes the change.</text>
</svg>
