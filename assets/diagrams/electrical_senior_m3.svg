<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Op-amp">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="291" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Op-amp</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<text x="105" y="58" font-size="12" font-weight="700" fill="#004E72" text-anchor="start">Inverting</text><polygon points="60,70 60,180 150,125" fill="#E8F1F7" stroke="#0E7FB0"/><text x="72" y="104" font-size="12" font-weight="400" fill="#092634" text-anchor="start">-</text><text x="72" y="152" font-size="12" font-weight="400" fill="#092634" text-anchor="start">+</text><text x="164" y="110" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">Rf = 10k</text><text x="164" y="150" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">Rin = 1k</text><text x="60" y="236" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Av = -Rf / Rin = -10</text><text x="385" y="58" font-size="12" font-weight="700" fill="#004E72" text-anchor="start">Non-inverting</text><polygon points="340,70 340,180 430,125" fill="#E8F1F7" stroke="#0E7FB0"/><text x="352" y="104" font-size="12" font-weight="400" fill="#092634" text-anchor="start">-</text><text x="352" y="152" font-size="12" font-weight="400" fill="#092634" text-anchor="start">+</text><text x="444" y="110" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">Rf = 9k</text><text x="444" y="150" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">Rin = 1k</text><text x="340" y="236" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Av = 1 + Rf / Rin = 10</text><text x="24" y="276" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">Ideal: infinite input resistance, virtual ground.  Output saturates at the supply.</text>
</svg>
