<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Voltage divider and Thevenin">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="261" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Voltage divider and Thevenin</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="90" y="60" width="180" height="160" fill="none" stroke="#0E7FB0" stroke-width="2.5"/><text x="180" y="50" font-size="11" font-weight="400" fill="#092634" text-anchor="middle">Vin</text><text x="180" y="240" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="middle">0 V</text><rect x="168" y="76" width="26" height="50" fill="#fff" stroke="#092634"/><text x="181" y="106" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">R1</text><rect x="168" y="150" width="26" height="50" fill="#fff" stroke="#092634"/><text x="181" y="180" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">R2</text><line x1="270" y1="140" x2="360" y2="140" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><text x="280" y="130" font-size="11" font-weight="400" fill="#004E72" text-anchor="start">Vout</text><text x="380" y="100" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Vout = Vin x R2 / (R1 + R2)</text><text x="380" y="132" font-size="12" font-weight="400" fill="#092634" text-anchor="start">R1 = R2  -&gt;  Vout = Vin / 2</text><text x="380" y="168" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Thevenin: source + series R_Th</text><text x="380" y="194" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Max power when R_L = R_Th</text>
</svg>
