<rect x="40" y="110" width="70" height="30" fill="#b91c1c"/><rect x="110" y="110" width="70" height="30" fill="#dc6a3a"/><rect x="180" y="110" width="70" height="30" fill="#e8a13a"/><rect x="250" y="110" width="70" height="30" fill="#7bbf6a"/><rect x="320" y="110" width="70" height="30" fill="#2f9e66"/><rect x="390" y="110" width="70" height="30" fill="#1f7f8f"/><rect x="460" y="110" width="70" height="30" fill="#22539a"/><rect x="530" y="110" width="70" height="30" fill="#2b2f8f"/><text x="40" y="162" font-size="12" font-weight="700" fill="#004E72" text-anchor="middle">0</text><text x="320" y="162" font-size="12" font-weight="700" fill="#004E72" text-anchor="middle">7</text><text x="600" y="162" font-size="12" font-weight="700" fill="#004E72" text-anchor="middle">14</text><text x="110" y="94" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="middle">acid</text><text x="320" y="94" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="middle">neutral</text><text x="560" y="94" font-size="12" font-weight="400" fill="#004E72" text-anchor="middle">basic</text><text x="40" y="60" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">pH = -log[H+]     each unit = 10x change     0.01 M HCl -&gt; pH 2</text>
