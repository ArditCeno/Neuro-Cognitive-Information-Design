<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Systems and homeostasis">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="269" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Systems and homeostasis</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="66" width="200" height="52" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="124" y="98" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle">Set point</text><line x1="224" y1="92" x2="300" y2="92" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><rect x="300" y="66" width="316" height="52" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="458" y="98" font-size="12.5" font-weight="700" fill="#004E72" text-anchor="middle">Negative feedback</text><line x1="458" y1="118" x2="458" y2="168" stroke="#092634" stroke-width="1.3"/><line x1="458" y1="168" x2="124" y2="168" stroke="#092634" stroke-width="1.3"/><line x1="124" y1="168" x2="124" y2="118" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><text x="280" y="186" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">returns the value toward the set point</text><text x="24" y="226" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Insulin lowers blood glucose; glucagon raises it.</text><text x="24" y="252" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Thermoregulation: sweating, shivering.  Positive feedback reinforces (e.g. birth).</text>
</svg>
