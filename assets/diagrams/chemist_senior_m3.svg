<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Kinetics and acid-base">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="249" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Kinetics and acid-base</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<line x1="60" y1="220" x2="300" y2="220" stroke="#d5dbdf" stroke-width="1.3"/><line x1="60" y1="220" x2="60" y2="64" stroke="#d5dbdf" stroke-width="1.3"/><text x="300" y="238" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">time</text><path d="M60 74 C 120 104 180 190 300 210" fill="none" stroke="#FF6E42" stroke-width="2.5"/><text x="340" y="90" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Rate rises with temperature</text><text x="340" y="112" font-size="12" font-weight="400" fill="#092634" text-anchor="start">and concentration</text><text x="340" y="144" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">v = k[A]^n</text><text x="340" y="170" font-size="12" font-weight="400" fill="#092634" text-anchor="start">First order: t1/2 = 0.693 / k</text><text x="340" y="196" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Strong acid dissociates fully</text><text x="340" y="222" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">pH + pOH = 14   (25 C)</text>
</svg>
