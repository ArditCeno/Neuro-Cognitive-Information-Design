<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" width="640" height="234" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Triage and emergency (START)">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="233" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Triage and emergency (START)</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="70" width="136" height="96" rx="10" fill="#F8C9C9" stroke="#d5dbdf"/><text x="92" y="116" font-size="15" font-weight="700" fill="#092634" text-anchor="middle">Red</text><text x="92" y="142" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">Immediate</text><rect x="174" y="70" width="136" height="96" rx="10" fill="#FEF7C3" stroke="#d5dbdf"/><text x="242" y="116" font-size="15" font-weight="700" fill="#092634" text-anchor="middle">Yellow</text><text x="242" y="142" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">Delayed</text><rect x="324" y="70" width="136" height="96" rx="10" fill="#DEFCE7" stroke="#d5dbdf"/><text x="392" y="116" font-size="15" font-weight="700" fill="#092634" text-anchor="middle">Green</text><text x="392" y="142" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">Minor (walking)</text><rect x="474" y="70" width="136" height="96" rx="10" fill="#D9DEE1" stroke="#d5dbdf"/><text x="542" y="116" font-size="15" font-weight="700" fill="#092634" text-anchor="middle">Black</text><text x="542" y="142" font-size="10" font-weight="400" fill="#092634" text-anchor="middle">Deceased / unsurvivable</text><text x="24" y="210" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start">START: walking?  breathing?  capillary refill?  consciousness?</text>
