<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" width="640" height="246" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Ohm's law">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="245" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Ohm's law</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<polygon points="320,60 200,220 440,220" fill="#E8F1F7" stroke="#0E7FB0"/><text x="320" y="108" font-size="30" font-weight="700" fill="#004E72" text-anchor="middle">V</text><text x="262" y="208" font-size="26" font-weight="700" fill="#004E72" text-anchor="middle">I</text><text x="378" y="208" font-size="26" font-weight="700" fill="#004E72" text-anchor="middle">R</text><text x="460" y="120" font-size="14" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">V = I x R</text><text x="460" y="148" font-size="14" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">I = V / R</text><text x="460" y="176" font-size="14" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">R = V / I</text><text x="460" y="214" font-size="12.5" font-weight="400" fill="#FF6E42" text-anchor="start">12 V / 4 ohm = 3 A</text>
</svg>
