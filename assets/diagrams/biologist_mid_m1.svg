<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Photosynthesis and respiration">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="241" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Photosynthesis and respiration</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="60" width="288" height="96" rx="8" fill="#EFF7F0" stroke="#9fd0a8"/><text x="40" y="88" font-size="13" font-weight="700" fill="#3f7a4a" text-anchor="start">Photosynthesis</text><text x="40" y="114" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">6CO2 + 6H2O + light</text><text x="40" y="136" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">-&gt; C6H12O6 + 6O2</text><rect x="328" y="60" width="288" height="96" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="344" y="88" font-size="13" font-weight="700" fill="#7a2b12" text-anchor="start">Cellular respiration</text><text x="344" y="114" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">C6H12O6 + 6O2</text><text x="344" y="136" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">-&gt; 6CO2 + 6H2O + ATP</text><line x1="312" y1="108" x2="328" y2="108" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><line x1="328" y1="120" x2="312" y2="120" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><text x="24" y="196" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Photosynthesis stores energy; respiration releases it.</text><text x="24" y="224" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">Glycolysis in the cytoplasm; Krebs cycle in the mitochondrial matrix.</text>
</svg>
