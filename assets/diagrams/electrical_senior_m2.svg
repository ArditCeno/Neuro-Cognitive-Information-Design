<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" width="640" height="298" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Systems and feedback">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="297" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Systems and feedback</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="60" y="80" width="90" height="60" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="105" y="116" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Input</text><circle cx="210" cy="110" r="18" fill="#fff" stroke="#092634"/><text x="210" y="115" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">+ -</text><rect x="260" y="80" width="110" height="60" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="315" y="116" font-size="14" font-weight="700" fill="#7a2b12" text-anchor="middle">A</text><rect x="410" y="80" width="100" height="60" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="460" y="116" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Output</text><line x1="150" y1="110" x2="192" y2="110" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><line x1="228" y1="110" x2="260" y2="110" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><line x1="370" y1="110" x2="410" y2="110" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><line x1="460" y1="140" x2="460" y2="200" stroke="#092634" stroke-width="1.3"/><line x1="460" y1="200" x2="210" y2="200" stroke="#092634" stroke-width="1.3"/><line x1="210" y1="200" x2="210" y2="128" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><text x="320" y="216" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="start">beta  (feedback)</text><text x="24" y="256" font-size="12" font-weight="400" fill="#004E72" text-anchor="start">A_cl = A / (1 + A beta)    negative feedback adds stability</text><text x="24" y="280" font-size="12" font-weight="400" fill="#092634" text-anchor="start">First-order step: 63.2% at one tau,  ~99.3% at 5 tau</text>
</svg>
