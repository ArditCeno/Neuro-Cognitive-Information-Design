<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Deadlines (teaching rule)">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="249" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Deadlines (teaching rule)</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<line x1="50" y1="150" x2="600" y2="150" stroke="#092634" stroke-width="2" marker-end="url(#ar)"/><circle cx="70" cy="150" r="6" fill="#FF6E42"/><text x="70" y="130" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">event</text><circle cx="220" cy="150" r="6" fill="#FF6E42"/><text x="220" y="115" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">day 1 starts the</text><text x="220" y="130" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">next day</text><circle cx="400" cy="150" r="6" fill="#FF6E42"/><text x="400" y="115" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">monthly rule:</text><text x="400" y="130" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">corresponding date</text><circle cx="560" cy="150" r="6" fill="#FF6E42"/><text x="560" y="115" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">holiday -&gt; first</text><text x="560" y="130" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">working day</text><text x="50" y="198" font-size="12" font-weight="400" fill="#092634" text-anchor="start">For days: the start day is not counted.</text><text x="50" y="222" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">Missing it can cause loss of the right.</text>
</svg>
