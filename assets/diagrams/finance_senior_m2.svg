<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Valuation (NPV)">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="291" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Valuation (NPV)</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<line x1="50" y1="130" x2="600" y2="130" stroke="#092634" stroke-width="1.5"/><circle cx="60" cy="130" r="7" fill="#FF6E42"/><text x="60" y="156" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="middle">t0</text><text x="60" y="114" font-size="12" font-weight="700" fill="#FF6E42" text-anchor="middle">-1000</text><circle cx="300" cy="130" r="7" fill="#0E7FB0"/><text x="300" y="156" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="middle">t1</text><text x="300" y="114" font-size="12" font-weight="700" fill="#0E7FB0" text-anchor="middle">+1100</text><circle cx="540" cy="130" r="7" fill="#9db7c2"/><text x="540" y="156" font-size="11" font-weight="400" fill="#2F7FA0" text-anchor="middle">t2</text><text x="540" y="114" font-size="12" font-weight="700" fill="#9db7c2" text-anchor="middle">...</text><rect x="50" y="190" width="590" height="84" rx="8" fill="#F7FAFB" stroke="#d5dbdf"/><text x="66" y="220" font-size="13" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">NPV = sum of present values - investment</text><text x="66" y="246" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">PV = cash flow / (1 + r)^t ;  r reflects risk</text><text x="66" y="266" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">NPV &gt; 0 : the project creates value</text>
</svg>
