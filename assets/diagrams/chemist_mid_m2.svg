<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Stoichiometry">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="259" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Stoichiometry</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="60" y="70" width="200" height="56" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="160" y="104" font-size="15" font-weight="400" fill="#092634" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">CH4</text><text x="160" y="162" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="middle">16 g  (1 mol)</text><line x1="260" y1="98" x2="380" y2="98" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><text x="320" y="88" font-size="12" font-weight="400" fill="#004E72" text-anchor="middle">+ 2 O2</text><rect x="380" y="70" width="200" height="56" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="480" y="104" font-size="14" font-weight="400" fill="#7a2b12" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">CO2 + 2H2O</text><text x="480" y="162" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="middle">44 g CO2</text><text x="24" y="216" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Molar ratios come from the coefficients.</text><text x="24" y="240" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">Limiting reactant runs out first.   % yield = actual / theoretical x 100</text>
</svg>
