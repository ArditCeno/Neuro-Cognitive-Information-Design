<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Basic circuits: series vs parallel">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="261" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Basic circuits: series vs parallel</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="70" width="260" height="150" rx="6" fill="none" stroke="#0E7FB0" stroke-width="2.5"/><rect x="114" y="60" width="60" height="20" fill="#092634"/><text x="144" y="55" font-size="11" font-weight="400" fill="#092634" text-anchor="middle">V</text><rect x="144" y="90" width="26" height="48" fill="#fff" stroke="#092634"/><text x="157" y="118" font-size="9.5" font-weight="400" fill="#092634" text-anchor="middle">R1</text><rect x="144" y="152" width="26" height="48" fill="#fff" stroke="#092634"/><text x="157" y="180" font-size="9.5" font-weight="400" fill="#092634" text-anchor="middle">R2</text><text x="154" y="246" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">Series: R = R1 + R2, same current</text><rect x="336" y="70" width="260" height="150" rx="6" fill="none" stroke="#0E7FB0" stroke-width="2.5"/><rect x="426" y="60" width="60" height="20" fill="#092634"/><text x="456" y="55" font-size="11" font-weight="400" fill="#092634" text-anchor="middle">V</text><line x1="456" y1="70" x2="456" y2="130" stroke="#092634" stroke-width="1.5"/><line x1="456" y1="160" x2="456" y2="220" stroke="#092634" stroke-width="1.5"/><rect x="380" y="130" width="26" height="48" fill="#fff" stroke="#092634"/><text x="393" y="158" font-size="9.5" font-weight="400" fill="#092634" text-anchor="middle">R1</text><rect x="526" y="130" width="26" height="48" fill="#fff" stroke="#092634"/><text x="539" y="158" font-size="9.5" font-weight="400" fill="#092634" text-anchor="middle">R2</text><text x="466" y="246" font-size="11.5" font-weight="400" fill="#004E72" text-anchor="middle">Parallel: same voltage, 1/R = 1/R1 + 1/R2</text>
</svg>
