<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Functions + lists + conditions">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="311" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Functions + lists + conditions</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="40" y="64" width="250" height="66" rx="8" fill="#F7FAFB" stroke="#d5dbdf"/><text x="56" y="90" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">def frekuenca(lst):</text><text x="56" y="112" font-size="11.5" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">  d[x] = d.get(x, 0) + 1</text><line x1="290" y1="98" x2="350" y2="98" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><rect x="350" y="64" width="250" height="66" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="475" y="102" font-size="12.5" font-weight="400" fill="#092634" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">[1, 2, 2, 3, 3, 3]</text><line x1="475" y1="130" x2="475" y2="166" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><rect x="350" y="166" width="250" height="66" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="475" y="204" font-size="14" font-weight="400" fill="#7a2b12" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">{1:1, 2:2, 3:3}</text><text x="40" y="268" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">d['a'] reads a key    d.get('k', 0) returns the default if missing</text><text x="40" y="290" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">enumerate() yields (index, value)    max([]) raises ValueError</text>
</svg>
