<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Hygiene and temperature">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="287" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Hygiene and temperature</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="90" y="56" width="34" height="210" rx="16" fill="#F4F8FA" stroke="#d5dbdf"/><rect x="90" y="140" width="34" height="86" fill="#FF6E42"/><text x="150" y="76" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">74 C - poultry inside</text><text x="150" y="186" font-size="12.5" font-weight="700" fill="#7a2b12" text-anchor="start">5 - 60 C  -  danger zone</text><text x="150" y="258" font-size="12" font-weight="400" fill="#004E72" text-anchor="start">5 C - keep cold at or below</text><text x="380" y="90" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">Wash hands 20-30 s</text><text x="380" y="120" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">Separate boards:</text><text x="380" y="144" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">raw meat   |   salad</text>
</svg>
