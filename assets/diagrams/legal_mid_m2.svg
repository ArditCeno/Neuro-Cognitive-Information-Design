<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Calculating deadlines">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="269" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Calculating deadlines</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<circle cx="34" cy="68" r="13" fill="#0E7FB0"/><text x="34" y="73" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="73" font-size="13.5" font-weight="400" fill="#092634" text-anchor="start">Notification starts the period</text><line x1="24" y1="86" x2="616" y2="86" stroke="#d5dbdf" stroke-width="1.3"/><circle cx="34" cy="110" r="13" fill="#0E7FB0"/><text x="34" y="115" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="115" font-size="13.5" font-weight="400" fill="#092634" text-anchor="start">Counting starts the day after the event</text><line x1="24" y1="128" x2="616" y2="128" stroke="#d5dbdf" stroke-width="1.3"/><circle cx="34" cy="152" r="13" fill="#0E7FB0"/><text x="34" y="157" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="60" y="157" font-size="13.5" font-weight="400" fill="#092634" text-anchor="start">Calendar days vs working days</text><line x1="24" y1="170" x2="616" y2="170" stroke="#d5dbdf" stroke-width="1.3"/><circle cx="34" cy="194" r="13" fill="#0E7FB0"/><text x="34" y="199" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="60" y="199" font-size="13.5" font-weight="400" fill="#092634" text-anchor="start">Suspension stops / interruption restarts</text><line x1="24" y1="212" x2="616" y2="212" stroke="#d5dbdf" stroke-width="1.3"/><circle cx="34" cy="236" r="13" fill="#0E7FB0"/><text x="34" y="241" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="60" y="241" font-size="13.5" font-weight="400" fill="#092634" text-anchor="start">Ends at the end of the last day</text>
</svg>
