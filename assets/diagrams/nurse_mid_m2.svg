<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Assessment (GCS)">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="275" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Assessment (GCS)</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="24" y="56" width="288" height="200" rx="8" fill="#F4F8FA" stroke="#d5dbdf"/><text x="40" y="82" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">Glasgow Coma Scale</text><text x="40" y="118" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">Eyes</text><text x="200" y="118" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">1-4</text><text x="40" y="152" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">Verbal</text><text x="200" y="152" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">1-5</text><text x="40" y="186" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">Motor</text><text x="200" y="186" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">1-6</text><text x="40" y="220" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start">Total</text><text x="200" y="220" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">3-15</text><rect x="328" y="56" width="288" height="200" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="344" y="82" font-size="13" font-weight="700" fill="#7a2b12" text-anchor="start">Interpretation</text><text x="344" y="118" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• GCS 15 = fully alert</text><text x="344" y="152" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• GCS &lt;= 8 = severe (airway risk)</text><text x="344" y="186" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Pain 0-10</text><text x="344" y="220" font-size="12" font-weight="400" fill="#092634" text-anchor="start">• Full head-to-toe assessment</text>
</svg>
