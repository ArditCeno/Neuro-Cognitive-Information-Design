<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Risk">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="309" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Risk</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<text x="24" y="78" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">Impact</text><rect x="150" y="56" width="150" height="80" rx="8" fill="#FEF7C3" stroke="#d5dbdf"/><text x="225" y="100" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Medium</text><rect x="300" y="56" width="150" height="80" rx="8" fill="#FDE0E0" stroke="#d5dbdf"/><text x="375" y="100" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">High</text><rect x="450" y="56" width="150" height="80" rx="8" fill="#F8C9C9" stroke="#d5dbdf"/><text x="525" y="100" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Critical</text><rect x="150" y="140" width="150" height="80" rx="8" fill="#DEFCE7" stroke="#d5dbdf"/><text x="225" y="184" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Low</text><rect x="300" y="140" width="150" height="80" rx="8" fill="#FEF7C3" stroke="#d5dbdf"/><text x="375" y="184" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">Medium</text><rect x="450" y="140" width="150" height="80" rx="8" fill="#FDE0E0" stroke="#d5dbdf"/><text x="525" y="184" font-size="12" font-weight="400" fill="#092634" text-anchor="middle">High</text><text x="64" y="240" font-size="13" font-weight="700" fill="#004E72" text-anchor="start">Risk = probability x impact</text><text x="64" y="268" font-size="12" font-weight="400" fill="#092634" text-anchor="start">Treatment:  avoid  -  mitigate  -  transfer  -  accept</text><text x="64" y="292" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">Residual risk after controls, monitored continuously</text>
</svg>
