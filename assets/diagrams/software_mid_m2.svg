<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" width="640" height="258" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Filtering lists">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="257" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Filtering lists</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="40" y="64" width="250" height="118" rx="8" fill="#F7FAFB" stroke="#d5dbdf"/><text x="56" y="90" font-size="12.5" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">a = [1, 2, 3, 4, 5, 6]</text><text x="56" y="118" font-size="12.5" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">a[1:3]</text><text x="150" y="118" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">-&gt; [2, 3]</text><text x="56" y="144" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">[x for x in a</text><text x="56" y="164" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">   if x % 2 == 0]</text><line x1="290" y1="120" x2="350" y2="120" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><rect x="350" y="84" width="250" height="72" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="475" y="112" font-size="13" font-weight="400" fill="#004E72" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">pare = [2, 4, 6]</text><text x="40" y="214" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">sorted() returns a new list    sum() adds    sorted(reverse=True) orders descending</text><text x="40" y="236" font-size="11.5" font-weight="400" fill="#2F7FA0" text-anchor="start">slicing creates a new list - it does not change the original</text>
</svg>
