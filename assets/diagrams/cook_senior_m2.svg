<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Food cost and pricing">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="267" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Food cost and pricing</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="60" y="64" width="520" height="56" rx="8" fill="#E8F1F7" stroke="#d5dbdf"/><text x="320" y="98" font-size="14" font-weight="400" fill="#004E72" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Food cost % = food cost / selling price x 100</text><line x1="320" y1="120" x2="320" y2="152" stroke="#092634" stroke-width="1.3" marker-end="url(#ar)"/><rect x="60" y="152" width="520" height="56" rx="8" fill="#FDE7DF" stroke="#d5dbdf"/><text x="320" y="186" font-size="13.5" font-weight="400" fill="#7a2b12" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Price = cost / target %        3 EUR / 30% = 10 EUR</text><text x="60" y="244" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">Typical target 28-35%.   Gross margin = price - cost.</text>
</svg>
