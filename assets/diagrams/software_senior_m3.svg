<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Debugging: reading a traceback">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#092634"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="291" fill="#ffffff" stroke="#d5dbdf"/>
<text x="24" y="30" font-size="14.5" font-weight="700" fill="#092634">Debugging: reading a traceback</text>
<line x1="24" y1="40" x2="616" y2="40" stroke="#d5dbdf"/>
<rect x="40" y="56" width="400" height="216" rx="8" fill="#F7FAFB" stroke="#d5dbdf"/><text x="56" y="84" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">Traceback (most recent call last):</text><text x="56" y="116" font-size="12" font-weight="400" fill="#004E72" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">  File "main.py", line 3</text><text x="56" y="148" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">    print(a[i])</text><text x="56" y="180" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">a = [1, 2, 3]</text><text x="56" y="212" font-size="12" font-weight="400" fill="#092634" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">for i in range(len(a)+1):</text><text x="56" y="244" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">IndexError: list index out of range</text><line x1="56" y1="214" x2="424" y2="214" stroke="#FF6E42" stroke-width="1.3" stroke-dasharray="4 4"/><text x="456" y="96" font-size="12.5" font-weight="700" fill="#004E72" text-anchor="start">Read from the bottom</text><text x="456" y="124" font-size="12" font-weight="400" fill="#2F7FA0" text-anchor="start">line 3 is the last executed</text><text x="456" y="150" font-size="12" font-weight="400" fill="#092634" text-anchor="start">range(5) goes 0..4</text><text x="456" y="176" font-size="12" font-weight="400" fill="#092634" text-anchor="start">range(len(a)+1) is the bug</text><text x="456" y="204" font-size="12" font-weight="400" fill="#15803d" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">fix: range(len(a))</text>
</svg>
