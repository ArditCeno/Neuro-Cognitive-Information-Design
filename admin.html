<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://script.google.com https://script.googleusercontent.com https://webgazer.cs.brown.edu https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co https://script.google.com https://script.googleusercontent.com https://webgazer.cs.brown.edu https://unpkg.com https://cdn.jsdelivr.net https://ncid-backend.onrender.com https://ncid-api.ncid-study.workers.dev; worker-src 'self' blob:; frame-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self' https://script.google.com https://script.googleusercontent.com" />
  <title>Admin | Neuro-Cognitive Information Design</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css?v=47" />
  <link rel="stylesheet" href="css/header.css?v=47" />
  <link rel="stylesheet" href="css/admin.css?v=47" />
</head>
<body class="dash-body">
<div id="site-header"></div>

<main class="dash-wrap">
  <!-- Login -->
  <section id="loginCard" class="login-card">
    <div class="login-brand">
      <img src="assets/logo.png" alt="NCID" />
      <div>
        <h1>Researcher login</h1>
        <p>Email and password, then a 6-digit code sent to your email.</p>
      </div>
    </div>
    <form class="form" autocomplete="on" onsubmit="return false">
      <label class="field"><span>Email</span>
        <input type="email" id="email" value="arditceno82@gmail.com" autocomplete="username" spellcheck="false" /></label>
      <label class="field"><span>Password</span>
        <input type="password" id="password" autocomplete="current-password" /></label>
      <button type="button" id="btnLogin" class="btn btn-primary">Send code</button>
    </form>
    <div id="codeStep" class="hidden" style="margin-top:16px">
      <label class="field"><span>Code (6 digits)</span>
        <input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" /></label>
      <div class="actions">
        <button type="button" id="btnVerify" class="btn btn-primary">Verify &amp; sign in</button>
        <button type="button" id="btnResend" class="btn btn-ghost btn-sm">Resend code</button>
      </div>
    </div>
    <p id="loginMsg" class="login-msg" role="status"></p>
  </section>

  <!-- Dashboard -->
  <section id="panel" class="hidden">
    <header class="dash-top">
      <div class="dash-title">
        <h1>Research dashboard</h1>
        <p>Neuro-Cognitive Information Design · live sessions</p>
      </div>
      <div class="dash-actions">
        <input id="q" type="search" placeholder="Search name, ID or profession" />
        <button id="btnReload" class="btn btn-ghost btn-sm">Refresh</button>
        <button id="btnCsv" class="btn btn-ghost btn-sm">Export CSV</button>
        <button id="btnSync" class="btn btn-ghost btn-sm">Sync to D1</button>
        <button id="btnDemo" class="btn btn-ghost btn-sm">Demo mode</button>
        <button id="btnLogout" class="btn btn-ghost btn-sm">Sign out</button>
        <div class="avatar" title="Researcher">AC</div>
      </div>
    </header>

    <p id="panelMsg" class="dash-note" role="status" aria-live="polite"></p>
    <div id="stats" class="stat-grid"></div>
    <div id="profs" class="prof-grid"></div>
  </section>
</main>

<!-- Profession / session drawer -->
<div id="detail" class="drawer" aria-hidden="true">
  <div class="drawer-panel" role="dialog" aria-modal="true">
    <div class="drawer-head">
      <h2 id="detailTitle">Profession</h2>
      <button id="btnCloseDetail" class="btn btn-ghost btn-sm">Close</button>
    </div>
    <div id="detailBody" class="drawer-body"></div>
  </div>
</div>

<script src="js/config.local.js" onerror="void 0"></script>
<script type="module">
  import { CONFIG } from "./js/config.js?v=57";
  import { renderNodeMap, renderHashmap, renderScatter } from "./js/visualize.js?v=57";
  window.__cfg = { fields: CONFIG.fields, adminEmail: CONFIG.adminEmail, submission: CONFIG.storage.submission };
  window.__viz = { renderNodeMap, renderHashmap, renderScatter };
</script>
<script src="js/admin.js?v=57"></script>
</body>
</html>
