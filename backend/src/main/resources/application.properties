# NCID Backend configuration.
# All values come from environment variables so no secret is committed.

server.port=${PORT:8080}

# Supabase / PostgreSQL connection (Project Settings -> Database).
# jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Start even if the database is temporarily unreachable (health checks / cold starts).
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5

# Create the sessions table on startup if it does not exist.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Admin token required for reading/deleting sessions (leave empty for open dev mode).
ncid.admin-token=${NCID_ADMIN_TOKEN:}

# Comma-separated allowed CORS origins (default: any).
ncid.allowed-origins=${NCID_ALLOWED_ORIGINS:*}

management.endpoints.web.exposure.include=health,info
